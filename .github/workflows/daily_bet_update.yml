name: Daily Betting Predictions

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write # Important: Allows the bot to write the HTML to your repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Betting Model
        run: |
          mkdir -p output/models
          # We tell the script to name the output 'index.html' for the website
          python updatemodel.py --html --refresh
          # Rename the output to index.html so it loads as the homepage
          mv predictions_*.html index.html || mv *.html index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
