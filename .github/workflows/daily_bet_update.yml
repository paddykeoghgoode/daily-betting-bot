name: Daily Betting Predictions

on:
  schedule:
    # Runs every day at 8:00 AM UTC (adjust as needed)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows you to trigger it manually for testing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Betting Model
        run: |
          # Creates the output directory and runs the script
          mkdir -p output/models
          python updatemodel.py --html --refresh

      - name: Upload HTML Prediction Report
        uses: actions/upload-artifact@v4
        with:
          name: daily-predictions
          # This captures any HTML file generated in your folder
          path: "*.html"
          retention-days: 7
