name: Daily Betting Predictions

on:
  schedule:
    # Runs at 09:00 UTC every day
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows you to run it manually

permissions:
  contents: write

jobs:
  run-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas numpy scipy requests scikit-learn openpyxl

      - name: Run Betting Model
        run: |
          # 1. Create the output folder so the script finds it
          mkdir -p output/models
          
          # 2. Run script saving the HTML into that folder
          # We use output/index.html so os.path.dirname returns 'output'
          python updatemodel.py --html --refresh --html-out output/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # This takes everything inside 'output' and puts it on the web
          publish_dir: ./output
          publish_branch: gh-pages
